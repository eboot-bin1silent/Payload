name: Build PS4 Payload

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile Payload Directly
        run: |
          # ترجمة ملف الـ C مباشرة وتحويله إلى باينري بصيغة bin
          clang -target x86_64-pc-none-elf -ffreestanding -nostdlib -c main.c -o main.o
          ld.lld -T linker.x --oformat binary main.o -o custom_payload.bin

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-payload
          path: "*.bin"
